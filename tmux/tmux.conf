# oh-my-term tmux.conf: the full tier. Needs tmux 3.0 or newer.
# The prefix is C-a and the window keys follow GNU screen, so switching between
# the two does not break muscle memory.
# Machine-specific settings go in ~/.tmux.conf.local, which is read last.

# ---------------------------------------------------------------------------
# Terminal and clipboard
# ---------------------------------------------------------------------------
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
    'set -g default-terminal "tmux-256color"' \
    'set -g default-terminal "screen-256color"'
set -ga terminal-overrides ',*256col*:Tc'
set -g set-clipboard on                 # copies reach the local clipboard over SSH (OSC52)
set -gq allow-passthrough on            # tmux 3.3+, lets programs inside send their own OSC52
set -g focus-events on

# ---------------------------------------------------------------------------
# Basics
# ---------------------------------------------------------------------------
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g history-limit 50000
set -g display-time 1500
set -g status-interval 5
setw -g aggressive-resize on
set -g mouse on
setw -g mode-keys vi

# ---------------------------------------------------------------------------
# Keys: prefix C-a, screen-style window keys
# ---------------------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind a send-prefix                      # C-a a sends a literal C-a, as in screen
bind C-a last-window                    # C-a C-a toggles between two windows, as in screen
bind A command-prompt -I '#W' 'rename-window "%%"'
bind '"' choose-window                  # C-a " lists the windows, as in screen
bind c new-window -c '#{pane_current_path}'
bind Space next-window

# Splits keep the current directory
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'

# Move between and resize panes with vim keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Copy mode: v starts a selection, y copies it
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

bind r source-file ~/.tmux.conf \; display-message 'tmux.conf reloaded'

# ---------------------------------------------------------------------------
# Nord colors (hex values from theme/palette.sh)
# ---------------------------------------------------------------------------
set -g status-style 'bg=#3B4252,fg=#D8DEE9'
set -g status-left-length 30
set -g status-left '#[bg=#81A1C1,fg=#2E3440,bold] #S #[default] '
set -g status-right '#{?client_prefix,#[fg=#EBCB8B]PREFIX #[default],}#[fg=#88C0D0]#H #[fg=#81A1C1]%Y-%m-%d %H:%M '
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format '#[bg=#4C566A,fg=#ECEFF4,bold] #I:#W#{?window_zoomed_flag, Z,} '
setw -g window-status-separator ''
set -g pane-border-style 'fg=#4C566A'
set -g pane-active-border-style 'fg=#81A1C1'
set -g message-style 'bg=#434C5E,fg=#ECEFF4'
set -g message-command-style 'bg=#434C5E,fg=#ECEFF4'
setw -g mode-style 'bg=#4C566A,fg=#ECEFF4'

# ---------------------------------------------------------------------------
# Plugins: loaded only when setup.sh (or vendor/) put them in place
# ---------------------------------------------------------------------------
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
if-shell '[ -f ~/.tmux/plugins/tmux-resurrect/resurrect.tmux ]' \
    'run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux'
if-shell '[ -f ~/.tmux/plugins/tmux-continuum/continuum.tmux ]' \
    'run-shell ~/.tmux/plugins/tmux-continuum/continuum.tmux'

if-shell '[ -f ~/.tmux.conf.local ]' 'source-file ~/.tmux.conf.local'
